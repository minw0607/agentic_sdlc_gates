# Release gates for AI-written code. Policy lives in gates.yaml; this file only wires the jobs.
#
# Job order: the dependency guard runs before anything installs the PR's dependencies, and the
# tests gate depends on it. Every gate writes reports/<gate>.json; the final "Gates verdict"
# job reads those reports and is the only check branch protection needs to require. GitHub
# counts a skipped job as passing, so the verdict never trusts job colors: a missing report
# blocks.
#
# Gate scripts run in a small pinned environment (pydantic + pyyaml) with --no-project, so
# they never install the PR's own dependencies. Third-party actions and binaries are pinned
# by commit SHA or checksum.
name: factory-gates

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: factory-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GATES_BASE_REF: ${{ github.event.pull_request.base.sha }}
  GATES_HEAD_REF: ${{ github.event.pull_request.head.sha }}
  GATE_PY: uv run --no-project --python 3.11 --with pydantic==2.14.3 --with pyyaml==6.0.3 python
  UV_VERSION: "0.13.6"
  OSV_VERSION: v2.7.0
  OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  dep_guard:
    name: G2 Dependency guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Check new dependencies (nothing is installed)
        run: $GATE_PY -m gates.dep_guard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-dep_guard
          path: reports/dep_guard.json
          if-no-files-found: ignore

  osv:
    name: G3 Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install OSV-Scanner (checksum verified)
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /usr/local/bin/osv-scanner" | sha256sum -c -
          chmod +x /usr/local/bin/osv-scanner
      - name: Scan uv.lock against the base branch (reads the lockfile only)
        run: $GATE_PY -m gates.osv_gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-osv
          path: reports/osv.json
          if-no-files-found: ignore

  secret_scan:
    name: G4 Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install gitleaks (checksum verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  /tmp/$f" | sha256sum -c -
          tar -xzf "/tmp/$f" -C /usr/local/bin gitleaks
      - name: Scan the PR's commits
        run: $GATE_PY -m gates.secret_scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-secret_scan
          path: reports/secret_scan.json
          if-no-files-found: ignore

  tests:
    name: G5 Tests and coverage
    needs: dep_guard # never install a dependency the guard rejected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run tests with coverage
        run: uv run python -m gates.tests_gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-tests
          path: |
            reports/tests.json
            reports/ac_map.json
            reports/junit.xml
            reports/coverage.json
          if-no-files-found: ignore

  traceability:
    name: G6 Traceability
    needs: tests
    # Run even when tests fail, so the trace shows which criteria lost their passing test.
    if: ${{ !cancelled() && (needs.tests.result == 'success' || needs.tests.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report-tests
          path: reports
      - name: Trace ticket to criteria, tests and commits
        env:
          # Passed through env, never interpolated into the script: PR titles are untrusted.
          GATES_PR_TITLE: ${{ github.event.pull_request.title }}
          GATES_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: $GATE_PY -m gates.traceability
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-traceability
          path: reports/traceability.json
          if-no-files-found: ignore

  verdict:
    name: Gates verdict
    needs: [dep_guard, osv, secret_scan, tests, traceability]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Summarize, comment on the PR, and decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATES_PR_NUMBER: ${{ github.event.pull_request.number }}
          GATES_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: $GATE_PY -m gates.summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence
          path: |
            reports/evidence.json
            reports/summary.md
