[project]
name = "agentic-sdlc-gates"
version = "0.0.1"
description = "Release gates for AI-written code, plus controls on the coding agent itself."
readme = "README.md"
license = "MIT"
authors = [{ name = "Min Wu" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pyyaml>=6",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "gates"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p pytester"

[tool.coverage.run]
branch = true
